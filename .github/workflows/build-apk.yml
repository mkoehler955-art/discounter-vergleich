name: APK bauen

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: AndroidX aktivieren
        run: echo "android.useAndroidX=true" > android/gradle.properties

      - name: APK bauen
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Discounter-Vergleich-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
